apiVersion: apps/v1
kind: Deployment
metadata:
  name: iportfolio-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: iportfolio
  template:
    metadata:
      labels:
        app: iportfolio
    spec:
      containers:
      - name: iportfolio
        image: aa3000/iportfolio:111
        ports:
        - containerPort: 80